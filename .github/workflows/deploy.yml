# Сборка статики и публикация на GitHub Pages.
#
# Pages — хостинг статики: Node.js он не запускает, поэтому Next.js собирается
# здесь, а на хостинг уезжает готовая папка out/. Сайт открывается не в корне
# домена, а в подпапке репозитория — https://<владелец>.github.io/<репозиторий>/,
# поэтому сборке передаются два адреса:
#
#   NEXT_PUBLIC_BASE_PATH — подпапка (/roseco48), из неё Next делает basePath,
#   NEXT_PUBLIC_SITE_URL  — адрес сайта, он нужен canonical, sitemap.xml,
#                           robots.txt и микроразметке.
#
# Оба значения считаются автоматически из имени репозитория. Если сайт переедет
# на свой домен, задайте в Settings → Secrets and variables → Actions → Variables
# переменные NEXT_PUBLIC_SITE_URL (например, https://ros-eco.ru) и, при
# необходимости, NEXT_PUBLIC_BASE_PATH — тогда подпапка станет пустой.
#
# Перед публикацией сборку проверяет scripts/check-static.mjs: адреса без
# подпапки, битые ссылки и потерянные шрифты ломают деплой сразу, а не после
# того, как сайт откроют в браузере.

name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только одна публикация; начатые не отменяем,
# чтобы не оставить сайт в промежуточном состоянии.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Define base path and site URL
        id: paths
        env:
          OVERRIDE_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          OVERRIDE_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"

          # Репозиторий <владелец>.github.io публикуется в корне домена,
          # остальные — в подпапке со своим именем.
          if [ "${repo,,}" = "${owner,,}.github.io" ]; then
            default_base_path=""
            default_site_url="https://${owner,,}.github.io"
          else
            default_base_path="/${repo}"
            default_site_url="https://${owner,,}.github.io/${repo}"
          fi

          # Свой домен отдаёт сайт из корня, поэтому подпапка убирается
          override_site_url="${OVERRIDE_SITE_URL%/}"
          if [ -n "$override_site_url" ] && [[ "$override_site_url" != *".github.io"* ]]; then
            default_base_path=""
            default_site_url="$override_site_url"
          fi

          echo "base_path=${OVERRIDE_BASE_PATH:-$default_base_path}" >> "$GITHUB_OUTPUT"
          echo "site_url=${override_site_url:-$default_site_url}" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site_url }}
        run: npm run build:static

      # .nojekyll в сборке уже есть (public/.nojekyll), но если файл потеряется,
      # Pages обработает выгрузку Jekyll'ом и выбросит папку _next — сайт
      # останется без стилей и скриптов. Поэтому ставим файл явно.
      - name: Ensure .nojekyll
        run: touch out/.nojekyll

      - name: Check static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site_url }}
        run: |
          echo "Подпапка: '${NEXT_PUBLIC_BASE_PATH}'"
          echo "Адрес сайта: '${NEXT_PUBLIC_SITE_URL}'"
          npm run check:static

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # .nojekyll — скрытый файл: без этого флага он не попадёт в артефакт
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
